<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="PaidSure animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020">
        <animate attributeName="stop-color" values="#0B1020;#131a33;#0B1020" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1B2440">
        <animate attributeName="stop-color" values="#1B2440;#0f2a3a;#1B2440" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5EFC"/>
      <stop offset="100%" stop-color="#14B8A6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6D5EFC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6D5EFC" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="260" fill="url(#glow)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="120" r="220" fill="url(#glow)" opacity="0.6">
    <animate attributeName="cy" values="120;160;120" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- floating coins -->
  <g fill="#F59E0B" opacity="0.85">
    <circle cx="880" cy="60" r="10"><animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="250" r="7"><animate attributeName="cy" values="250;225;250" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="80" r="8"><animate attributeName="cy" values="80;105;80" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="220" r="11"><animate attributeName="cy" values="220;195;220" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- verified check badge with pulse -->
  <g transform="translate(600 150)">
    <circle r="54" fill="none" stroke="#14B8A6" stroke-width="3" opacity="0.6">
      <animate attributeName="r" values="54;72;54" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="0" fill="#16A34A" filter="url(#soft)">
      <animate attributeName="r" values="0;50;50" keyTimes="0;0.2;1" dur="0.9s" fill="freeze"/>
    </circle>
    <path d="M-20 2 L-6 16 L22 -12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0" begin="0.8s" dur="0.6s" fill="freeze"/>
    </path>
  </g>

  <!-- title and tagline -->
  <text x="120" y="130" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#brand)">PaidSure</text>
  <text x="122" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#E8ECF8">Paid? Sure.</text>
  <text x="122" y="218" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#9AA5BF">Screenshot-proof UPI payment confirmation for every counter in India</text>
  <text x="122" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#14B8A6" letter-spacing="2">NO GATEWAY  ·  NO FEES  ·  NO FAKE SCREENSHOTS</text>
</svg>
